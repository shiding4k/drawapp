<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>線上幸運大抽獎</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      padding: 35px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      width: 100%;
      max-width: 420px;
    }
    h1 {
      color: #2d3748;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }
    .prize-display {
      background: #f7fafc;
      border: 2px dashed #cbd5e0;
      border-radius: 12px;
      padding: 24px 12px;
      margin-bottom: 25px;
      min-height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.35rem;
      font-weight: bold;
      color: #2d3748;
      word-break: break-word;
    }
    /* 加大後的抽獎按鈕 */
    .draw-btn {
      background: #48bb78;
      color: white;
      border: none;
      padding: 20px 30px; /* 加大內邊距 */
      font-size: 1.5rem;   /* 加大字體 */
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(72, 187, 120, 0.45);
      width: 100%;
      touch-action: manipulation;
      transition: transform 0.1s, background 0.2s;
    }
    .draw-btn:active {
      transform: scale(0.95);
      background: #38a169;
    }
    .draw-btn:disabled {
      background: #a0aec0;
      box-shadow: none;
      transform: none;
    }
    .remaining-info {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #718096;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎉 幸運大抽獎</h1>

    <!-- 顯示區域預設保持空白，抽獎時才會顯示內容 -->
    <div id="prizeResult" class="prize-display"></div>

    <button id="drawBtn" class="draw-btn" onclick="drawPrize()">開始抽獎</button>

    <div id="remainingText" class="remaining-info">
      剩餘總獎項數量：11 個
    </div>
  </div>

  <script>
    let prizePool = [
      "🎁 500元禮物卡",
      "🎁 500元禮物卡",
      "🎁 500元禮物卡",
      "🎁 500元禮物卡",
      "☕ 中杯美式咖啡 10杯",
      "☕ 中杯美式咖啡 10杯",
      "☕ 中杯美式咖啡 10杯",
      "☕ 中杯美式咖啡 10杯",
      "☕ 中杯美式咖啡 10杯",
      "☕ 中杯美式咖啡 10杯",
      "☕ 中杯美式咖啡 10杯"
    ];

    let isDrawing = false;

    function drawPrize() {
      if (isDrawing || prizePool.length === 0) return;

      isDrawing = true;
      const btn = document.getElementById('drawBtn');
      const resultDiv = document.getElementById('prizeResult');
      btn.disabled = true;

      let counter = 0;
      const tempPrizes = ["🎁 500元禮物卡", "☕ 中杯美式咖啡 10杯", "❓ 幸運大獎", "✨ 恭喜獲獎"];
      
      const interval = setInterval(() => {
        resultDiv.textContent = tempPrizes[counter % tempPrizes.length];
        counter++;
      }, 80);

      setTimeout(() => {
        clearInterval(interval);

        const randomIndex = Math.floor(Math.random() * prizePool.length);
        const wonPrize = prizePool.splice(randomIndex, 1)[0];

        resultDiv.textContent = `恭喜獲得：${wonPrize}`;
        document.getElementById('remainingText').textContent = `剩餘總獎項數量：${prizePool.length} 個`;

        isDrawing = false;

        if (prizePool.length > 0) {
          btn.disabled = false;
        } else {
          btn.textContent = "獎項已全數抽完";
        }
      }, 1500);
    }
  </script>
</body>
</html>
